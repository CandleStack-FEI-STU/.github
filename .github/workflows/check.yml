name: Check

# `edited` too: editing the title or description checks the new text.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  # No AI attribution in commits or the pull request. Nothing else to build here.
  # The local path runs the pull request's own copy of the shared check, so a change that
  # breaks it fails here before it reaches main, which every other repository calls.
  no-ai-signs:
    uses: ./.github/workflows/no-ai-signs.yml

  # The description closes an issue ("Closes #N"). Same local path, for the same reason.
  linked-issue:
    uses: ./.github/workflows/linked-issue.yml

  # Unit tests of the scripts that other repositories run through pre-commit.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  # The title and branch follow the conventions; a warning when the pull request is large.
  pr-hygiene:
    uses: ./.github/workflows/pr-hygiene.yml
    permissions:
      pull-requests: read

  # The pre-commit hooks (.pre-commit-config.yaml) on every file: formatting, secrets, typos,
  # comments, Markdown, and actionlint and zizmor on the workflows.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files --show-diff-on-failure
