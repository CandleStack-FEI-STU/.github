name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security issue? Do not open an issue: follow the
        [security policy](https://github.com/CandleStack-FEI-STU/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://stage.candlestack.tech
        2. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Environment (local, preview, stage, prod), URL or commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Error messages, a Sentry link, screenshots. No keys, tokens or personal data.
